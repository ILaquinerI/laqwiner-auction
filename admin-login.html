<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAQWINER — Вход</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#304866 0,transparent 42%),#05070b;color:#fff;font-family:Inter,system-ui,Arial}.box{width:min(420px,92vw);padding:32px;border:1px solid #33465f;border-radius:22px;background:linear-gradient(180deg,#101925f2,#080c12f2);box-shadow:0 25px 100px #000}.logo{text-align:center;font-size:25px;font-weight:1000;letter-spacing:.05em}.muted{text-align:center;color:#8c9aae;font-size:12px;margin:8px 0 22px}input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #34465e;background:#080d14;color:#fff;outline:0;font-size:15px}button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;background:#fff;color:#080b10;font-weight:1000;cursor:pointer}.err{min-height:20px;text-align:center;color:#ff8d8d;font-size:12px;margin-top:10px}.back{display:block;text-align:center;color:#8190a4;text-decoration:none;font-size:11px;margin-top:18px}</style></head><body><form class="box" id="form"><div class="logo">🔐 LAQWINER ADMIN</div><div class="muted">Админ-панель закрыта. Введите пароль.</div><input id="password" type="password" placeholder="Пароль администратора" autocomplete="current-password" autofocus><button>ВОЙТИ В АДМИНКУ</button><div class="err" id="err"></div><a class="back" href="/">← Вернуться на сайт</a></form><script>form.onsubmit=async e=>{e.preventDefault();err.textContent='';const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});if(r.ok)location.href='/admin';else err.textContent='Неверный пароль'};</script></body></html>
