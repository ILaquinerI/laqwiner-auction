<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAQWINER — Админка</title><style>
*{box-sizing:border-box}body{margin:0;background:#060a10;color:#eef4fa;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:1450px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{font-size:22px;font-weight:1000}.muted{color:#738399;font-size:10px;margin-top:4px}.sync{color:#7fe7a7;font-size:9px;font-weight:1000}.back{color:#9cb0c5;text-decoration:none;font-size:10px;margin-left:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric,.panel{background:#0b121b;border:1px solid #24354a;border-radius:16px}.metric{padding:14px}.metric span{display:block;color:#718198;font-size:8px;font-weight:1000;letter-spacing:.12em}.metric b{display:block;font-size:23px;margin-top:5px}.panel{padding:16px;margin-top:12px}.timer{display:grid;grid-template-columns:180px 1fr auto;gap:10px;align-items:end}.label{display:block;color:#7c8da3;font-size:8px;font-weight:1000;margin-bottom:5px}input,select{width:100%;background:#070b11;color:#fff;border:1px solid #34475e;border-radius:9px;padding:10px;outline:none}button{border:0;background:#172435;color:#fff;border-radius:9px;padding:10px 12px;font-weight:1000;cursor:pointer}button.primary{background:#fff;color:#06090d}button.danger{background:#612731}.timerBig{font-size:28px;font-weight:1000;font-variant-numeric:tabular-nums}.timerStatus{font-size:9px;color:#718198;margin-top:3px}.buttons{display:flex;gap:6px;flex-wrap:wrap}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar input{max-width:260px;margin-left:auto}.rows{display:grid;gap:8px;margin-top:12px}.row{display:grid;grid-template-columns:44px 1.5fr 150px 120px 120px 180px;gap:8px;align-items:center;background:#080e16;border:1px solid #203148;border-radius:13px;padding:8px}.tank{display:flex;align-items:center;gap:10px}.tank img{width:105px;height:60px;object-fit:contain}.tank b{font-size:12px}.amount,.chance{font-weight:1000}.chance{color:#a9d1f7}.status{font-size:9px;font-weight:1000}.ok{color:#76e2a0}.bad{color:#ff9ca8}.actions{display:flex;gap:5px;flex-wrap:wrap}.orderRow{display:grid;grid-template-columns:1fr 1fr 2fr 120px 170px;gap:10px;align-items:center;background:#080e16;border:1px solid #203148;border-radius:12px;padding:10px}.orderName{font-weight:1000;font-size:12px}.orderMeta{font-size:9px;color:#718198}.orderStatus{font-size:9px;font-weight:1000}.orderStatus.new{color:#f2c66d}.orderStatus.done{color:#76e2a0}.toast{position:fixed;right:15px;bottom:15px;padding:11px 14px;background:#101a27;border:1px solid #40556d;border-radius:10px;display:none}.toast.show{display:block}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.timer{grid-template-columns:1fr}.row{grid-template-columns:30px 1fr 110px}.row .chance,.row .status,.row .actions{grid-column:2/-1}}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 100px}.tank img{width:70px}}
</style></head><body><div class="wrap"><header class="top"><div><div class="brand">⚙️ LAQWINER — АДМИНКА</div><div class="muted">Суммы поддержки, доля общей поддержки, таймер и состояние танков</div></div><div><span class="sync" id="sync">● СИНХРОНИЗАЦИЯ</span><a class="back" href="/">← сайт</a><button onclick="logout()">Выйти</button></div></header><div class="grid"><div class="metric"><span>ВСЕГО ТАНКОВ</span><b id="all">32</b></div><div class="metric"><span>ПОДДЕРЖАНЫ</span><b id="funded">0</b></div><div class="metric"><span>ОБЩАЯ ПОДДЕРЖКА</span><b id="bank">0 ₽</b></div><div class="metric"><span>РАУНД</span><b id="round">#1</b></div></div><section class="panel"><div class="timer"><div><label class="label">ДЛИТЕЛЬНОСТЬ, МИН.</label><input id="mins" type="number" min="1" max="10080" value="60"></div><div><label class="label">ТАЙМЕР</label><div class="timerBig" id="tv">01:00:00</div><div class="timerStatus" id="ts">Не запущен</div></div><div class="buttons"><button class="primary" onclick="timer('set')">💾 УСТАНОВИТЬ</button><button onclick="timer('start')">▶️ СТАРТ</button><button onclick="timer('pause')">⏸ ПАУЗА</button><button onclick="timer('reset')">↺ СБРОС</button></div></div></section><section class="panel"><div class="toolbar"><b>32 ТАНКА</b><input id="search" placeholder="🔎 Поиск" oninput="render()"><button onclick="newRound()">↻ НОВЫЙ РАУНД</button><button class="danger" onclick="resetAll()">♻️ СБРОСИТЬ АУКЦИОН</button></div><div class="rows" id="rows"></div></section></div><div class="toast" id="toast"></div><script>
let S=null,ws;const money=n=>new Intl.NumberFormat('ru-RU').format(Math.round(Number(n)||0))+' ₽';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function fmt(x){x=Math.max(0,Math.floor(x));let h=Math.floor(x/3600),m=Math.floor(x%3600/60),s=x%60;return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}function rem(t){return t?.running&&t.endsAt?Math.max(0,Math.ceil((Number(t.endsAt)-Date.now())/1000)):null}function toast(x){let e=document.getElementById('toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}async function api(u,opt={}){let r=await fetch(u,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка');return d}function render(){if(!S)return;let q=(document.getElementById('search').value||'').toLowerCase();let ts=(S.tanks||[]).filter(t=>t.name.toLowerCase().includes(q));let total=(S.tanks||[]).reduce((a,t)=>a+Number(t.amount||0),0);let funded=(S.tanks||[]).filter(t=>Number(t.amount)>0);document.getElementById('all').textContent=S.tanks.length;document.getElementById('funded').textContent=funded.length;document.getElementById('bank').textContent=money((S.tanks||[]).reduce((a,t)=>a+Number(t.amount||0),0));document.getElementById('round').textContent='#'+(S.round||1);document.getElementById('rows').innerHTML=ts.map(t=>`<div class="row"><div>#${t.id}</div><div class="tank"><img src="${t.image}"><div><b>${esc(t.name)}</b><div class="muted">${t.alive===false?'Выбыл':'В игре'}</div></div></div><div><label class="label">ПОДДЕРЖКА ₽</label><input id="a${t.id}" type="number" min="0" value="${Number(t.amount)||0}"></div><div><label class="label">ДОЛЯ ОТ ОБЩЕЙ СУММЫ</label><div class="chance" id="c${t.id}">0.00%</div></div><div class="chance">${total>0?(Number(t.amount||0)/total*100).toFixed(2):'0.00'}%</div><div class="status ${t.alive===false?'bad':'ok'}">${t.alive===false?'ВЫБЫЛ':'В ИГРЕ'}</div><div class="actions"><button class="primary" onclick="save(${t.id})">💾 Сохранить</button><button onclick="toggle(${t.id})">${t.alive===false?'↩ Вернуть':'✖ Выбыл'}</button></div></div>`).join('');renderTimer()}function renderTimer(){if(!S)return;let t=S.timer||{},r=rem(t);document.getElementById('tv').textContent=fmt(t.running&&r!==null?r:(t.durationSec||3600));document.getElementById('ts').textContent=t.running?(r===0?'Аукцион завершён':'Идёт'):'Не запущен'}async function load(){try{let r=await fetch('/api/state',{cache:'no-store'});S=await r.json();render()}catch(e){}}async function save(id){let t=S.tanks.find(x=>x.id===id);t.amount=Math.max(0,Number(document.getElementById('a'+id).value)||0);try{S=await api('/api/state',{method:'PUT',body:JSON.stringify(S)});toast('Сохранено')}catch(e){toast(e.message)}}async function toggle(id){let t=S.tanks.find(x=>x.id===id);t.alive=!t.alive;await save(id)}async function timer(action){try{let body={action};if(action==='set')body.minutes=Number(document.getElementById('mins').value)||60;let d=await api('/api/timer',{method:'POST',body:JSON.stringify(body)});S=d.state;render();toast('Таймер обновлён')}catch(e){toast(e.message)}}async function newRound(){if(!confirm('Начать новый раунд?'))return;try{let d=await api('/api/new-round',{method:'POST'});S=d.state;render();toast('Новый раунд')}catch(e){toast(e.message)}}async function resetAll(){if(!confirm('Сбросить весь аукцион?'))return;try{S=await api('/api/reset',{method:'POST'});render();toast('Сброшено')}catch(e){toast(e.message)}}</script></body></html>
