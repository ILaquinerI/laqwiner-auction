];const money=n=>new Intl.NumberFormat('ru-RU').format(Math.round(n||0))+' ₽';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function get(){S=await(await fetch('/api/state',{cache:'no-store'})).json();render();}function connect(){try{ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.onopen=()=>sync('● СИНХРОНИЗИРОВАНО');ws.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==='state'){S=x.state;render();sync('● СИНХРОНИЗИРОВАНО')}}catch{}};ws.onclose=()=>{sync('● ПЕРЕПОДКЛЮЧЕНИЕ…');setTimeout(connect,1500)}}catch{setTimeout(connect,1500)}}
let lastUpdated=0;setInterval(async()=>{try{const s=await(await fetch('/api/state',{cache:'no-store'})).json();if(s.updatedAt!==lastUpdated){lastUpdated=s.updatedAt;S=s;render();sync('● СИНХРОНИЗИРОВАНО')}}catch{}},1000);function sync(x){document.getElementById('sync').textContent=x}function render(){if(!S)return;const active=S.tanks.filter(t=>t.alive&&t.amount>0),bank=active.reduce((a,t)=>a+t.amount,0);document.getElementById('bank').textContent=money(bank);document.getElementById('active').textContent=active.length;document.getElementById('alive').textContent=S.tanks.filter(t=>t.alive).length;document.getElementById('dead').textContent=S.tanks.filter(t=>!t.alive).length;document.getElementById('round').textContent='#'+S.round;const q=document.getElementById('search').value.toLowerCase();const ts=S.tanks.filter(t=>t.name.toLowerCase().includes(q));document.getElementById('table').innerHTML=ts.map(t=>`<div class="row ${t.alive?'':'dead'}"><b>#${t.id}</b><div class="tank"><img src="${t.image}"><b>${esc(t.name)}</b></div><div class="amount">${money(t.amount)}</div><div class="status ${t.alive?'ok':'bad'}">${t.alive?'В ИГРЕ':'ВЫБЫЛ'}</div><div class="actions"><button onclick="edit(${t.id})">Изменить</button><button onclick="toggle(${t.id})">${t.alive?'Выбить':'Вернуть'}</button></div></div>`).join('');const sel=document.getElementById('select');const cur=sel.value;sel.innerHTML=S.tanks.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');if(cur)sel.value=cur;edit(Number(sel.value)||1)}function edit(id){const t=S.tanks.find(x=>x.id===id);if(t){document.getElementById('select').value=id;document.getElementById('amount').value=t.amount}}document.getElementById('select').onchange=()=>edit(Number(document.getElementById('select').value));function setQ(v){document.getElementById('amount').value=v}async function put(n){S=await(await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(n)})).json();render();toast('Сохранено')}async function saveAmount(){const n=structuredClone(S),id=Number(document.getElementById('select').value),v=Math.max(0,Number(document.getElementById('amount').value)||0);n.tanks.find(t=>t.id===id).amount=v;await put(n)}async function toggle(id){const n=structuredClone(S),t=n.tanks.find(x=>x.id===id);t.alive=!t.alive;await put(n)}async function spin(){if(window.spinLoop)return;window.spinLoop=true;try{while(true){const fresh=await (await fetch('/api/state',{cache:'no-store'})).json();S=fresh;render();const active=S.tanks.filter(t=>t.alive&&t.amount>0);if(active.length<2){toast(active.length===1?'🏆 Остался последний танк: '+active[0].name:'Нужно минимум 2 танка с донатами');break}const r=await fetch('/api/spin',{method:'POST'}),d=await r.json();if(!r.ok){toast(d.error);break}toast('🎰 Выбывает: '+d.targetName);await new Promise(resolve=>setTimeout(resolve,18600));const after=await (await fetch('/api/state',{cache:'no-store'})).json();S=after;render();if(S.tanks.filter(t=>t.alive&&t.amount>0).length<2)break}}catch(e){toast('Ошибка: '+e.message)}finally{window.spinLoop=false}}async function undo(){const r=await fetch('/api/undo',{method:'POST'}),d=await r.json();if(!r.ok)return toast(d.error);toast('Последнее выбытие отменено')}async function newRound(){const r=await fetch('/api/new-round',{method:'POST'}),d=await r.json();if(!r.ok)return toast(d.error);toast('Новый раунд начат')}async function resetAll(){if(!confirm('Полностью сбросить аукцион?'))return;const r=await fetch('/api/reset',{method:'POST'});S=await r.json();render();toast('Аукцион сброшен')}function toast(x){const t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}get().then(connect)</script><script>
(async()=>{const st=document.getElementById('authstate'),li=document.getElementById('loginBtn'),lo=document.getElementById('logoutBtn');

li.onclick=async()=>{const p=prompt('Пароль администратора:');if(p===null)return;const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});if(!r.ok){alert('Неверный пароль');return}await check();location.reload()};lo.onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.reload()};await check();})();
