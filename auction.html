<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAQWINER — OBS</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden}.stage{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:30px}.widget{width:min(1100px,94vw);background:linear-gradient(180deg,#0b111bdc,#05070bdc);border:1px solid #596a83;border-radius:22px;padding:16px;box-shadow:0 20px 100px #0008}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:1000}.round{font-size:10px;color:#9aa8ba}.roulette{margin-top:10px;height:190px;border:1px solid #40516a;border-radius:16px;overflow:hidden;background:#020406;position:relative}.pointer{position:absolute;z-index:5;left:50%;top:0;transform:translateX(-50%);border-left:15px solid transparent;border-right:15px solid transparent;border-top:28px solid #fff;filter:drop-shadow(0 0 9px #fff)}.line{position:absolute;z-index:4;left:50%;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 15px #fff}.belt{display:flex;gap:9px;padding:40px 10px 10px;will-change:transform}.tile{flex:0 0 160px;background:#101722;border:1px solid #2d3c52;border-radius:12px;padding:7px;text-align:center}.tile img{width:100%;height:95px;object-fit:contain}.tile b{font-size:10px;display:block;min-height:24px}.result{text-align:center;font-size:19px;font-weight:1000;margin-top:9px}.result span{color:#b8c4d5;font-size:10px}.hidden{display:none}.final{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#020305ee}.final.show{display:flex}.finalBox{text-align:center;width:min(900px,92vw);padding:35px;border:1px solid #73859e;border-radius:28px;background:radial-gradient(circle at 50% 0,#3c536f,#080b11 65%);box-shadow:0 30px 150px #000}.finalTitle{font-size:46px;font-weight:1000}.final img{width:min(620px,90%);height:240px;object-fit:contain}.finalName{font-size:34px;font-weight:1000}.finalSub{color:#aab7c9}.flash{position:fixed;left:50%;top:12%;transform:translateX(-50%);background:#fff;color:#05070b;padding:12px 18px;border-radius:12px;font-weight:1000;display:none;box-shadow:0 0 60px #fff}.flash.show{display:block;animation:pop 2.4s ease}@keyframes pop{0%{transform:translate(-50%,-30px);opacity:0}15%{transform:translate(-50%,0);opacity:1}80%{opacity:1}100%{opacity:0}}
</style></head><body><div class="stage"><div class="widget"><div class="top"><div class="brand">🔥 LAQWINER AUCTION</div><div class="round">РАУНД <b id="round">1</b> • OBS</div></div><div class="roulette"><div class="pointer"></div><div class="line"></div><div class="belt" id="belt"></div></div><div class="result" id="result"><span>СТАТУС</span><br>РУЛЕТКА ГОТОВА</div></div></div><div class="flash" id="flash"></div><div class="final" id="final"><div class="finalBox"><div>🏆 ФИНАЛ АУКЦИОНА</div><div class="finalTitle">ПОБЕДИТЕЛЬ</div><img id="winImg"><div class="finalName" id="winName"></div><div class="finalSub">3 ОТМЕТКИ — ПОЕХАЛИ 🔥</div></div></div>
<script>let S=null,old={},ws,anim=false;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>new Intl.NumberFormat('ru-RU').format(Math.round(n||0))+' ₽';async function get(){S=await(await fetch('/api/state',{cache:'no-store'})).json();render(S)}function render(s){if(!s)return;document.getElementById('round').textContent=s.round;const active=s.tanks.filter(t=>t.alive&&t.amount>0);if(!anim)build(active);if(s.lastResultName){document.getElementById('result').innerHTML='<span>ПОСЛЕДНИЙ ВЫБЫВШИЙ</span><br>'+esc(s.lastResultName)}const alive=s.tanks.filter(t=>t.alive);if(alive.length===1&&s.history?.length){document.getElementById('winImg').src=alive[0].image;document.getElementById('winName').textContent=alive[0].name;document.getElementById('final').classList.add('show')}}function build(a){const b=document.getElementById('belt');b.innerHTML=a.length?a.concat(a,a,a,a).map(t=>`<div class="tile"><img src="${t.image}"><b>${esc(t.name)}</b></div>`).join(''):'<div style="padding:55px;text-align:center;color:#738196;width:100%">ОЖИДАЕМ ТАНКИ С БАНКОМ</div>';b.style.transform='translateX(0)'}function connect(){try{ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type!=='state')return;handleState(x.state)}catch{}};ws.onclose=()=>setTimeout(connect,1500)}catch{setTimeout(connect,1500)}}
function handleState(next){const prev=S;S=next;if(prev&&S.lastEliminatedId&&S.lastEliminatedId!==prev.lastEliminatedId){animate(prev.tanks.filter(t=>t.alive&&t.amount>0),S.lastEliminatedId,S.tanks.find(t=>t.id===S.lastEliminatedId)?.name||S.lastResultName)}else render(S)}
let pollStamp=0;setInterval(async()=>{try{const s=await(await fetch('/api/state',{cache:'no-store'})).json();if(s.updatedAt!==pollStamp){pollStamp=s.updatedAt;handleState(s)}}catch{}},1000)function animate(active,targetId,name){if(anim||active.length<2){render(S);return}anim=true;const b=document.getElementById('belt');b.innerHTML='';const seq=[];for(let i=0;i<12;i++)seq.push(...active);const idx=11*active.length+active.findIndex(t=>t.id===targetId);seq.forEach(t=>{const d=document.createElement('div');d.className='tile';d.innerHTML=`<img src="${t.image}"><b>${esc(t.name)}</b>`;b.appendChild(d)});requestAnimationFrame(()=>{const tile=b.children[idx],center=b.parentElement.getBoundingClientRect().width/2,x=tile.offsetLeft+tile.offsetWidth/2;b.style.transition='transform 8s cubic-bezier(.06,.78,.08,1)';b.style.transform=`translateX(${-(x-center)}px)`;setTimeout(()=>{document.getElementById('result').innerHTML='<span>💥 ВЫБЫВАЕТ</span><br>'+esc(name);flash('💥 '+name+' ВЫБЫВАЕТ');anim=false;render(S)},8200)})}function flash(x){const f=document.getElementById('flash');f.textContent=x;f.classList.add('show');setTimeout(()=>f.classList.remove('show'),2400)}get().then(connect)</script></body></html>
