<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAQWINER — Аукцион на 3 отметки</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Inter,Arial,sans-serif}.stage{position:fixed;inset:0;display:grid;place-items:center}.widget{width:min(96vw,980px);height:min(96vh,980px);display:flex;flex-direction:column;align-items:center;justify-content:center}.top{width:min(96vw,900px);display:flex;justify-content:space-between;align-items:end;margin-bottom:10px;text-shadow:0 3px 18px #000}.brand{font-size:clamp(16px,2vw,28px);font-weight:1000;letter-spacing:.03em}.brand span{display:block;font-size:.45em;letter-spacing:.18em;color:#d4b36b;margin-top:4px}.status{font-size:10px;color:#b9c4d4}.roulette{position:relative;width:min(82vh,82vw,760px);height:min(82vh,82vw,760px);aspect-ratio:1/1;border-radius:50%;background:radial-gradient(circle at 50% 50%,#18283a 0,#080d15 50%,#010204 100%);box-shadow:0 0 0 5px #101b29,0 0 0 9px #c99a3d66,0 0 55px #d3a34a44,0 35px 120px #000;overflow:visible}.roulette:before{content:"";position:absolute;inset:-2%;border-radius:50%;border:2px solid #e0b65c99;box-shadow:inset 0 0 45px #000,0 0 25px #d5a64666}.roulette:after{content:"";position:absolute;inset:2%;border-radius:50%;border:1px dashed #fff3;pointer-events:none}.pointer{position:absolute;z-index:60;left:50%;top:-25px;transform:translateX(-50%);width:0;height:0;border-left:25px solid transparent;border-right:25px solid transparent;border-top:48px solid #fff;filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 25px #d5a646);}.pointer:after{content:"";position:absolute;left:-12px;top:-43px;border-left:12px solid transparent;border-right:12px solid transparent;border-top:23px solid #d5a646}.wheel{position:absolute;inset:0;border-radius:50%;will-change:transform}.face{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 2px #fff2,inset 0 0 70px #000}.items{position:absolute;inset:0}.item{position:absolute;left:50%;top:50%;width:clamp(76px,11vw,112px);height:clamp(64px,8vw,90px);margin:calc(-1 * clamp(32px,4vw,45px)) calc(-1 * clamp(38px,5.5vw,56px));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid #fff3;border-radius:12px;background:linear-gradient(180deg,#182536ee,#060b12f0);box-shadow:0 8px 22px #000b;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(calc(-1 * min(32vw,32vh,250px))) rotate(calc(-1 * var(--angle)));overflow:hidden}.item img{width:88%;height:52%;object-fit:contain;filter:drop-shadow(0 5px 7px #000)}.item b{font-size:clamp(7px,.75vw,10px);white-space:nowrap;max-width:95%;overflow:hidden;text-overflow:ellipsis}.item small{font-size:clamp(5px,.55vw,8px);color:#d8c48e;margin-top:2px}.item.target{border-color:#fff;box-shadow:0 0 35px #fff,0 0 70px #d6a74eaa}.hub{position:absolute;z-index:40;left:50%;top:50%;width:18%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#4b5e76,#080d14 68%);border:3px solid #d9e4f166;box-shadow:0 0 0 9px #0b131f,0 0 55px #000,inset 0 0 30px #000}.hub strong{font-size:clamp(20px,4vw,42px);letter-spacing:.08em}.hub small{font-size:6px;letter-spacing:.28em;color:#c7d0de}.ring{position:absolute;inset:-10px;border-radius:50%;border:1px dashed #d8a64f88;animation:r 3s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.flash{position:absolute;z-index:55;inset:4%;border-radius:50%;pointer-events:none;opacity:0}.flash.show{animation:f 1.5s ease}@keyframes f{0%{opacity:0;box-shadow:0 0 0 #fff}35%{opacity:1;box-shadow:0 0 90px #fff,0 0 170px #d5a64699}100%{opacity:0;box-shadow:0 0 10px #fff0}}.result{margin-top:12px;text-align:center;text-shadow:0 3px 15px #000;font-size:clamp(12px,1.5vw,20px);font-weight:1000}.result span{font-size:.55em;color:#c8d1df;letter-spacing:.18em}.sound{position:fixed;right:16px;bottom:16px;z-index:100;border:1px solid #d5a64688;background:#080d14dd;color:#fff;border-radius:999px;padding:9px 13px;font-size:10px;font-weight:900;cursor:pointer}.final{position:fixed;inset:0;display:none;place-items:center;background:#010204ed;backdrop-filter:blur(10px)}.final.show{display:grid}.finalBox{text-align:center;width:min(900px,90vw);padding:35px;border:1px solid #d6aa5b;border-radius:28px;background:radial-gradient(circle at 50% 0,#3a2e1c,#080b11 65%);box-shadow:0 30px 150px #000}.finalTitle{font-size:clamp(30px,5vw,58px);font-weight:1000}.final img{width:min(620px,90%);height:260px;object-fit:contain}.finalName{font-size:clamp(25px,4vw,42px);font-weight:1000}.finalSub{color:#d9c78f}
</style></head><body><div class="stage"><div class="widget"><div class="top"><div class="brand">🔥 LAQWINER <span>АУКЦИОН НА 3 ОТМЕТКИ • БОЛЬШЕ ДОНАТ — МЕНЬШЕ ШАНС ВЫБЫТЬ</span></div><div class="status" id="status">РУЛЕТКА ГОТОВА</div></div><div class="roulette"><div class="pointer">▼</div><div class="wheel" id="wheel"><div class="face" id="face"></div><div class="items" id="items"></div><div class="hub"><div class="ring"></div><strong>LAQ</strong><small>AUCTION</small></div></div><div class="flash" id="flash"></div></div><div class="result" id="result"><span>СТАТУС</span><br>РУЛЕТКА ГОТОВА</div></div></div><button class="sound" id="sound">🔊 ЗВУК ВКЛ</button><div class="final" id="final"><div class="finalBox"><div>🏆 АУКЦИОН НА 3 ОТМЕТКИ ЗАВЕРШЁН</div><div class="finalTitle">ПОСЛЕДНИЙ ТАНК</div><img id="winImg"><div class="finalName" id="winName"></div><div class="finalSub">ВРЕМЯ БРАТЬ 3 ОТМЕТКИ 🔥</div></div></div><script>
let S=null,anim=false,ws,audioCtx=null,audioOn=true,tickTimer=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>new Intl.NumberFormat('ru-RU').format(Math.round(n||0))+' ₽';
function audioUnlock(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch{}}function tone(f,d=.05,type='sine',g=.03){if(!audioOn)return;try{audioUnlock();const o=audioCtx.createOscillator(),a=audioCtx.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(g,audioCtx.currentTime);a.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(a).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch{}}function startSound(){tone(100,.2,'sawtooth',.05);setTimeout(()=>tone(180,.1,'square',.03),100)}function tick(){tone(160+Math.random()*100,.028,'square',.02)}function finish(){tone(250,.1,'sine',.05);setTimeout(()=>tone(380,.14,'sine',.05),100);setTimeout(()=>tone(520,.25,'sine',.06),220)}
function build(a,target){const face=document.getElementById('face'),items=document.getElementById('items');items.innerHTML='';if(!a.length)return 0;const raw=a.map(t=>({t,w:1/Math.max(1,Number(t.amount)||1)})),total=raw.reduce((x,y)=>x+y.w,0);let acc=0,targetAngle=0;const cols=['#c28b2c','#314d69','#6a4d78','#3f6a61','#76583f','#435f80','#66526f','#536b55'],st=[];raw.forEach((x,i)=>{const t=x.t,w=x.w/total,amount=Number(t.amount)||0,ch=w*100,start=acc*360,end=(acc+w)*360,mid=(start+end)/2;st.push(`${cols[i%cols.length]} ${start}deg ${Math.max(start+.3,end-.3)}deg`,`#0b1018 ${Math.max(start+.3,end-.3)}deg ${end}deg`);const d=document.createElement('div');d.className='item'+(t.id===target?' target':'');d.style.setProperty('--angle',mid+'deg');d.innerHTML=`<img src="${t.image}"><b>${esc(t.name)}</b><small>${money(amount)} • ${ch.toLocaleString('ru-RU',{maximumFractionDigits:1})}%</small>`;items.appendChild(d);if(t.id===target)targetAngle=mid;acc+=w});face.style.background=`conic-gradient(from 0deg,${st.join(',')})`;document.getElementById('wheel').style.transition='none';document.getElementById('wheel').style.transform='rotate(0deg)';return targetAngle}
function animate(a,id,name){if(anim)return;anim=true;audioUnlock();startSound();const target=build(a,id),wheel=document.getElementById('wheel'),flash=document.getElementById('flash');let elapsed=0;clearInterval(tickTimer);tickTimer=setInterval(()=>{elapsed+=180;tick()},180);document.getElementById('status').textContent='🎰 РУЛЕТКА КРУТИТСЯ…';document.getElementById('result').innerHTML='<span>СУДЬБА РЕШАЕТСЯ</span><br>НЕ ОТВОДИМ ВЗГЛЯД';requestAnimationFrame(()=>requestAnimationFrame(()=>{const spins=14+Math.floor(Math.random()*3);wheel.style.transition='transform 18s cubic-bezier(.06,.82,.08,1)';wheel.style.transform=`rotate(${-target+spins*360}deg)`;flash.classList.add('show');setTimeout(()=>flash.classList.remove('show'),1500);setTimeout(()=>{clearInterval(tickTimer);finish();document.getElementById('status').textContent='💥 '+name+' ВЫБЫЛ';document.getElementById('result').innerHTML='<span>ПОСЛЕДНИЙ РЕЗУЛЬТАТ</span><br>💥 '+esc(name)+' ВЫБЫВАЕТ';anim=false;},18000)}))}
function render(s){S=s;const a=s.tanks.filter(t=>t.alive&&t.amount>0);document.getElementById('status').textContent=a.length===1?'🏆 ОСТАЛСЯ ПОСЛЕДНИЙ ТАНК':'РУЛЕТКА ГОТОВА';if(!anim)build(a);if(a.length===1&&s.history?.length){document.getElementById('winImg').src=a[0].image;document.getElementById('winName').textContent=a[0].name;document.getElementById('final').classList.add('show');finish()}}
function handle(n){if(!S){render(n);return}if(n.updatedAt===S.updatedAt)return;const old=S,a=old.tanks.filter(t=>t.alive&&t.amount>0);if(n.lastEliminatedId&&n.lastEliminatedId!==old.lastEliminatedId&&a.some(t=>t.id===n.lastEliminatedId)){const id=n.lastEliminatedId,name=n.tanks.find(t=>t.id===id)?.name||'ТАНК';S=n;animate(a,id,name)}else render(n)}
function connect(){try{ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==='state')handle(x.state)}catch{}};ws.onclose=()=>setTimeout(connect,1500)}catch{setTimeout(connect,1500)}}async function poll(){try{handle(await(await fetch('/api/state',{cache:'no-store'})).json())}catch{}}setInterval(poll,1000);document.getElementById('sound').onclick=()=>{audioUnlock();audioOn=!audioOn;document.getElementById('sound').textContent=audioOn?'🔊 ЗВУК ВКЛ':'🔇 ЗВУК ВЫКЛ'};window.addEventListener('pointerdown',audioUnlock,{once:true});fetch('/api/state',{cache:'no-store'}).then(r=>r.json()).then(render).then(connect);
</script></body></html>
