<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAQWINER — Аукцион на 3 отметки OBS</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden}.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}.widget{width:min(760px,96vw);padding:12px;text-align:center}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;text-shadow:0 3px 15px #000}.brand{font-size:20px;font-weight:1000}.round{font-size:10px;color:#b8c4d5}.roulette{margin:auto;width:min(650px,88vw);height:min(650px,88vw);max-height:78vh;aspect-ratio:1;border:1px solid #50627a;border-radius:50%;position:relative;background:radial-gradient(circle at 50% 50%,#1a2637 0,#06090e 50%,#020406 100%);box-shadow:0 0 0 5px #172438,0 0 0 9px #53678344,0 25px 100px #000c,inset 0 0 100px #000;overflow:hidden}.roulette:before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle,#fff000 0 1px,transparent 1px 8px);opacity:.12}.pointer{position:absolute;z-index:30;left:50%;top:-2px;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:36px solid #fff;filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 25px #79a8ff)}.wheel{position:absolute;inset:0;border-radius:50%;transform:rotate(0deg);will-change:transform}.face{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 2px #a9bbd133,inset 0 0 55px #000}.items{position:absolute;inset:0}.item{position:absolute;left:50%;top:50%;width:105px;height:78px;margin:-39px -52px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #dce7f344;border-radius:12px;background:#0c1420ee;box-shadow:0 6px 20px #000b;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(-245px) rotate(calc(-1 * var(--angle)));overflow:hidden}.item img{width:88px;height:48px;object-fit:contain}.item b{font-size:8px;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}.item small{font-size:6px;color:#aebbd0}.item.target{border-color:#fff;box-shadow:0 0 30px #fff,0 0 70px #7fa9ff88}.hub{position:absolute;z-index:20;left:50%;top:50%;width:125px;height:125px;margin:-62.5px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 40% 30%,#3b506b,#080c12 70%);border:3px solid #a9b9cc66;box-shadow:0 0 0 8px #111a26,0 0 50px #000,inset 0 0 25px #000}.hub strong{font-size:28px;font-weight:1000;letter-spacing:.08em}.ring{position:absolute;inset:-9px;border-radius:50%;border:1px dashed #dbe8fa55;animation:r 3s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.flash{position:absolute;z-index:40;inset:8%;border-radius:50%;pointer-events:none;opacity:0}.flash.show{animation:f 1.4s ease}@keyframes f{0%{opacity:0;box-shadow:0 0 0 #fff}45%{opacity:1;box-shadow:0 0 80px #fff,0 0 160px #80aaff77}100%{opacity:0;box-shadow:0 0 10px #fff0}}.result{margin-top:9px;font-size:20px;font-weight:1000;text-shadow:0 3px 15px #000}.result span{font-size:10px;color:#b8c4d5}.final{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#020305ee}.final.show{display:flex}.finalBox{text-align:center;width:min(900px,92vw);padding:35px;border:1px solid #73859e;border-radius:28px;background:radial-gradient(circle at 50% 0,#3c536f,#080b11 65%);box-shadow:0 30px 150px #000}.finalTitle{font-size:46px;font-weight:1000}.final img{width:min(620px,90%);height:240px;object-fit:contain}.finalName{font-size:34px;font-weight:1000}.finalSub{color:#aab7c9}.hidden{display:none}
</style></head><body><div class="stage"><div class="widget"><div class="top"><div class="brand">🔥 LAQWINER — АУКЦИОН НА 3 ОТМЕТКИ</div><div class="round">РАУНД <b id="round">1</b> • OBS</div></div><div class="roulette"><div class="pointer">▼</div><div class="wheel" id="wheel"><div class="face" id="face"></div><div class="items" id="items"></div><div class="hub"><div class="ring"></div><strong>LAQ</strong></div></div><div class="flash" id="flash"></div></div><div class="result" id="result"><span>СТАТУС</span><br>РУЛЕТКА ГОТОВА</div></div></div><div class="final" id="final"><div class="finalBox"><div>🏆 ФИНАЛ АУКЦИОНА НА 3 ОТМЕТКИ</div><div class="finalTitle">ПОСЛЕДНИЙ ТАНК</div><img id="winImg"><div class="finalName" id="winName"></div><div class="finalSub">3 ОТМЕТКИ — ПОЕХАЛИ 🔥</div></div></div>
<script>let S=null,anim=false,ws,timer;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>new Intl.NumberFormat('ru-RU').format(Math.round(n||0))+' ₽';function build(a,targetId){const face=document.getElementById('face'),items=document.getElementById('items');items.innerHTML='';if(!a.length){face.style.background='#0b111a';return}const total=a.reduce((x,t)=>x+Math.max(0,Number(t.amount)||0),0);let acc=0,target=0;const cols=['#40597a','#5b496f','#4f6d65','#735a46','#3f5870','#66506a','#4f6856','#6a5360'],st=[];a.forEach((t,i)=>{const amount=Math.max(0,Number(t.amount)||0),w=amount/total,chance=w*100,start=acc*360,end=(acc+w)*360,mid=(start+end)/2;st.push(`${cols[i%cols.length]} ${start}deg ${Math.max(start+.4,end-.4)}deg`,`#0b1018 ${Math.max(start+.4,end-.4)}deg ${end}deg`);const d=document.createElement('div');d.className='item'+(t.id===targetId?' target':'');d.style.setProperty('--angle',mid+'deg');d.innerHTML=`<img src="${t.image}"><b>${esc(t.name)}</b><small>${money(amount)} • ${chance.toLocaleString('ru-RU',{maximumFractionDigits:1})}%</small>`;items.appendChild(d);if(t.id===targetId)target=mid;acc+=w});face.style.background=`conic-gradient(from 0deg,${st.join(',')})`;document.getElementById('wheel').style.transition='none';document.getElementById('wheel').style.transform='rotate(0deg)';return target}function render(s){S=s;document.getElementById('round').textContent=s.round;const a=s.tanks.filter(t=>t.alive&&t.amount>0);if(!anim)build(a);if(a.length===1&&s.history?.length){document.getElementById('winImg').src=a[0].image;document.getElementById('winName').textContent=a[0].name;document.getElementById('final').classList.add('show')}}function handle(next){if(!S){render(next);return}if(next.updatedAt===S.updatedAt)return;const old=S,active=old.tanks.filter(t=>t.alive&&t.amount>0);if(next.lastEliminatedId&&next.lastEliminatedId!==old.lastEliminatedId&&active.some(t=>t.id===next.lastEliminatedId)){const id=next.lastEliminatedId;const name=next.tanks.find(t=>t.id===id)?.name||'ТАНК';S=next;animate(active,id,name)}else render(next)}async function animate(a,id,name){if(anim||a.length<2){render(S);return}anim=true;const target=build(a,id),wheel=document.getElementById('wheel'),flash=document.getElementById('flash');requestAnimationFrame(()=>requestAnimationFrame(()=>{const spins=12+Math.floor(Math.random()*4);wheel.style.transition='transform 17s cubic-bezier(.08,.82,.08,1)';wheel.style.transform=`rotate(${spins*360-target}deg)`;flash.classList.add('show');setTimeout(()=>flash.classList.remove('show'),1400);setTimeout(()=>{document.getElementById('result').innerHTML='<span>💥 ВЫБЫВАЕТ</span><br>'+esc(name);anim=false;render(S)},17400)}))}function connect(){try{ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==='state')handle(x.state)}catch{}};ws.onclose=()=>setTimeout(connect,1500)}catch{setTimeout(connect,1500)}}async function poll(){try{const s=await(await fetch('/api/state',{cache:'no-store'})).json();handle(s)}catch{}}setInterval(poll,1000);fetch('/api/state',{cache:'no-store'}).then(r=>r.json()).then(render).then(connect);</script></body></html>
