<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAQWINER — Roulette OBS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Inter,Arial,sans-serif}.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}.roulette{position:relative;width:min(92vh,92vw);height:min(92vh,92vw);aspect-ratio:1;border-radius:50%;filter:drop-shadow(0 30px 80px #000);}.roulette:before{content:"";position:absolute;inset:-18px;border-radius:50%;border:2px solid #8b9bb3;box-shadow:0 0 0 5px #101926,0 0 0 7px #596b84aa,0 0 60px #6d8eb655;pointer-events:none}.roulette:after{content:"";position:absolute;inset:-8px;border-radius:50%;background:repeating-conic-gradient(from 0deg,#ffffff22 0 1deg,transparent 1deg 8deg);mask:radial-gradient(circle,transparent 0 48%,#000 49% 100%);opacity:.5;pointer-events:none}.pointer{position:absolute;z-index:50;left:50%;top:-29px;transform:translateX(-50%);width:0;height:0;border-left:25px solid transparent;border-right:25px solid transparent;border-top:46px solid #fff;filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 24px #7197c9)}.pointer:after{content:"";position:absolute;left:-9px;top:-45px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:17px solid #111b29}.wheel{position:absolute;inset:0;border-radius:50%;transform:rotate(0deg);will-change:transform;overflow:hidden;border:4px solid #172335;background:#0b111a;box-shadow:inset 0 0 80px #000,inset 0 0 0 2px #d8e4f422}.labels{position:absolute;inset:0}.label{position:absolute;left:50%;top:50%;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-weight:1000;text-shadow:0 2px 7px #000;transform:translate(-50%,-50%) rotate(var(--a)) translateY(calc(var(--r) * -1)) rotate(calc(var(--a) * -1));padding:5px}.label span{max-width:140px;font-size:clamp(10px,1.35vw,18px);line-height:1.05;word-break:break-word}.label small{display:block;font-size:clamp(7px,.8vw,11px);color:#d6dfeb;margin-top:4px}.hub{position:absolute;z-index:40;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 25%,#394d67,#080d14 68%);border:4px solid #7f92aa;box-shadow:0 0 0 8px #0c1420,0 0 50px #000,inset 0 0 30px #000}.hub b{font-size:clamp(20px,3vw,44px);letter-spacing:.08em}.hub small{position:absolute;bottom:23%;font-size:clamp(5px,.6vw,9px);letter-spacing:.28em;color:#aab8c9}.glow{position:absolute;inset:3%;border-radius:50%;pointer-events:none;box-shadow:inset 0 0 45px #fff2,0 0 35px #6f95c855}.status{position:absolute;z-index:60;left:50%;bottom:-48px;transform:translateX(-50%);font-size:13px;font-weight:900;letter-spacing:.08em;text-shadow:0 3px 14px #000;white-space:nowrap}.flash{position:absolute;z-index:45;inset:0;border-radius:50%;opacity:0;pointer-events:none}.flash.show{animation:flash 1.2s ease}@keyframes flash{0%{opacity:0;box-shadow:0 0 0 #fff}35%{opacity:1;box-shadow:0 0 80px #fff,0 0 180px #789bff99}100%{opacity:0;box-shadow:0 0 10px #fff0}}.final{position:fixed;inset:0;background:#020408f5;display:none;align-items:center;justify-content:center;text-align:center;z-index:100;backdrop-filter:blur(8px)}.final.show{display:flex}.finalBox{padding:45px 70px;border:1px solid #7287a2;border-radius:28px;background:radial-gradient(circle at 50% 0,#314864,#070b11 65%);box-shadow:0 30px 150px #000}.finalBox small{letter-spacing:.25em;color:#b9c6d7}.finalBox h1{font-size:clamp(35px,6vw,72px);margin:10px 0}.finalName{font-size:clamp(28px,4vw,54px);font-weight:1000}@media(max-aspect-ratio:1/1){.roulette{width:78vw;height:78vw}}@media(max-width:600px){.roulette{width:78vw;height:78vw}.status{font-size:9px;bottom:-35px}}
</style></head><body><div class="stage"><div class="roulette"><div class="pointer"></div><div class="wheel" id="wheel"><div id="face"></div><div class="labels" id="labels"></div><div class="hub"><b>LAQ</b><small>AUCTION</small></div></div><div class="glow"></div><div class="flash" id="flash"></div><div class="status" id="status">РУЛЕТКА ГОТОВА</div></div></div><div class="final" id="final"><div class="finalBox"><small>АУКЦИОН НА 3 ОТМЕТКИ</small><h1>ПОСЛЕДНИЙ ТАНК</h1><div class="finalName" id="finalName"></div></div></div>
<script>
let S=null,anim=false,reconnectTimer=null,pollStamp=0;
const money=n=>new Intl.NumberFormat('ru-RU').format(Math.round(Number(n)||0))+' ₽';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const colors=['#243f62','#60476f','#315f58','#74533d','#3d5878','#68465d','#3d654e','#76504e','#334f70','#5b4770'];
function activeOf(s){return s.tanks.filter(t=>t.alive&&Number(t.amount)>0)}
function build(active,targetId){const face=document.getElementById('face'),labels=document.getElementById('labels');labels.innerHTML='';if(!active.length){face.style.background='#0a1018';return 0}const raw=active.map(t=>1/Math.max(1,Number(t.amount)||1));const total=raw.reduce((a,b)=>a+b,0);let acc=0,target=0;const stops=[];const R=45;active.forEach((t,i)=>{const w=raw[i]/total;const start=acc*360,end=(acc+w)*360,mid=(start+end)/2;stops.push(`${colors[i%colors.length]} ${start}deg ${end}deg`);const d=document.createElement('div');d.className='label';d.style.setProperty('--a',mid+'deg');d.style.setProperty('--r',R+'%');d.style.width=Math.max(80,Math.min(190,Math.sqrt(w)*800))+'px';d.innerHTML=`<span>${esc(t.name)}<small>${money(t.amount)} • ${(w*100).toLocaleString('ru-RU',{maximumFractionDigits:1})}%</small></span>`;labels.appendChild(d);if(t.id===targetId)target=mid;acc+=w});face.style.position='absolute';face.style.inset='0';face.style.borderRadius='50%';face.style.background=`conic-gradient(from 0deg,${stops.join(',')})`;document.getElementById('wheel').style.transition='none';document.getElementById('wheel').style.transform='rotate(0deg)';return target}
function showFinal(s){const a=activeOf(s);if(a.length===1&&s.history?.length){document.getElementById('finalName').textContent=a[0].name;document.getElementById('final').classList.add('show')}}
function render(s){S=s;document.getElementById('status').textContent=activeOf(s).length<2?'НУЖНО МИНИМУМ 2 ТАНКА':'РУЛЕТКА ГОТОВА';if(!anim)build(activeOf(s),null);showFinal(s)}
function animate(oldActive,id,name){return new Promise(resolve=>{anim=true;const target=build(oldActive,id),wheel=document.getElementById('wheel');document.getElementById('status').textContent='РУЛЕТКА КРУТИТСЯ…';requestAnimationFrame(()=>requestAnimationFrame(()=>{const spins=12+Math.floor(Math.random()*3),final=-target+spins*360;wheel.style.transition='transform 18s cubic-bezier(.08,.82,.08,1)';wheel.style.transform=`rotate(${final}deg)`;document.getElementById('flash').classList.add('show');setTimeout(()=>document.getElementById('flash').classList.remove('show'),1200);setTimeout(()=>{document.getElementById('status').textContent='💥 '+name+' ВЫБЫЛ';anim=false;resolve()},18100)}))})}
async function handle(next){if(!next?.tanks)return;if(!S){pollStamp=next.updatedAt||0;render(next);return}if((next.updatedAt||0)===(S.updatedAt||0))return;const old=S,oldActive=activeOf(old);const eliminated=next.lastEliminatedId&&next.lastEliminatedId!==old.lastEliminatedId&&oldActive.some(t=>t.id===next.lastEliminatedId);S=next;pollStamp=next.updatedAt||0;if(eliminated&&!anim&&oldActive.length>=2){const t=oldActive.find(x=>x.id===next.lastEliminatedId);await animate(oldActive,t.id,t.name);render(next)}else if(!anim)render(next)}
function connect(){try{const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state')handle(m.state)}catch{}};ws.onclose=()=>{clearTimeout(reconnectTimer);reconnectTimer=setTimeout(connect,1500)}}catch{reconnectTimer=setTimeout(connect,1500)}}
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});if(r.ok){const s=await r.json();await handle(s)}}catch{}}
setInterval(poll,1000);poll();connect();
</script></body></html>
