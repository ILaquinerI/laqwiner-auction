<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAQWINER — OBS Roulette</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Inter,Arial,sans-serif}.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}.roulette{position:relative;width:min(88vh,88vw);height:min(88vh,88vw);border-radius:50%;filter:drop-shadow(0 30px 80px #000)}.ring{position:absolute;inset:-15px;border-radius:50%;border:2px solid #8298b1;box-shadow:0 0 0 5px #0a111b,0 0 0 7px #445b73,0 0 55px #6b9bd866;pointer-events:none;z-index:10}.pointer{position:absolute;z-index:50;left:50%;top:-34px;transform:translateX(-50%);width:0;height:0;border-left:27px solid transparent;border-right:27px solid transparent;border-top:48px solid #fff;filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 20px #79a5dc)}.pointer:after{content:"";position:absolute;left:-9px;top:-47px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:17px solid #101722}.wheel{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:5px solid #152234;background:#09101a;box-shadow:inset 0 0 100px #000,inset 0 0 0 2px #dceaff22;transform:rotate(0deg);will-change:transform}.face{position:absolute;inset:0;border-radius:50%}.items{position:absolute;inset:0}.item{position:absolute;left:50%;top:50%;width:155px;height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:translate(-50%,-50%) translate(var(--x),var(--y)) rotate(var(--rot));z-index:3;text-shadow:0 2px 8px #000}.item img{width:105px;height:68px;object-fit:contain;filter:drop-shadow(0 8px 10px #000)}.item b{font-size:12px;line-height:1.05;max-width:145px}.item small{font-size:9px;color:#c3d0df;margin-top:4px}.hub{position:absolute;z-index:40;left:50%;top:50%;width:23%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#3d5772,#080d14 67%);border:4px solid #8da0b6;box-shadow:0 0 0 8px #0b1420,0 0 50px #000,inset 0 0 30px #000}.hub b{font-size:clamp(22px,3.5vw,48px);letter-spacing:.08em}.hub small{position:absolute;bottom:23%;font-size:8px;letter-spacing:.25em;color:#aebdd0}.status{position:absolute;z-index:70;left:50%;bottom:-48px;transform:translateX(-50%);font-size:13px;font-weight:1000;letter-spacing:.08em;white-space:nowrap;text-shadow:0 3px 14px #000}.info{position:fixed;left:26px;top:24px;z-index:80;padding:12px 15px;border:1px solid #2c4058;background:#07101ae8;border-radius:14px;box-shadow:0 12px 40px #0008}.info b{font-size:13px}.info span{display:block;margin-top:4px;color:#7f90a5;font-size:10px}.flash{position:absolute;z-index:45;inset:0;border-radius:50%;opacity:0;pointer-events:none}.flash.show{animation:flash 1.1s ease}@keyframes flash{0%{opacity:0;box-shadow:0 0 0 #fff}35%{opacity:1;box-shadow:0 0 80px #fff,0 0 180px #78a5ff99}100%{opacity:0}}.final{position:fixed;inset:0;background:#020408f7;display:none;align-items:center;justify-content:center;text-align:center;z-index:100;backdrop-filter:blur(10px)}.final.show{display:flex}.finalBox{min-width:min(700px,90vw);padding:45px 60px;border:1px solid #7287a2;border-radius:28px;background:radial-gradient(circle at 50% 0,#314864,#070b11 65%);box-shadow:0 30px 150px #000}.finalBox small{letter-spacing:.25em;color:#b9c6d7}.finalBox h1{font-size:clamp(35px,6vw,72px);margin:10px 0}.winnerImg{width:260px;height:150px;object-fit:contain;filter:drop-shadow(0 18px 25px #000)}.finalName{font-size:clamp(28px,4vw,54px);font-weight:1000}@media(max-width:700px){.roulette{width:78vw;height:78vw}.item{width:100px;height:90px}.item img{width:72px;height:48px}.item b{font-size:8px}.item small{font-size:7px}.info{left:10px;top:10px}.status{bottom:-35px;font-size:9px}}
</style>
</head>
<body>
<div class="info"><b>🔥 LAQWINER</b><span id="sub">РУЛЕТКА • ТАНКИ С ПОДДЕРЖКОЙ</span></div>
<div class="stage"><div class="roulette"><div class="pointer"></div><div class="wheel" id="wheel"><div class="face" id="face"></div><div class="items" id="items"></div><div class="hub"><b>LAQ</b><small>AUCTION</small></div></div><div class="ring"></div><div class="flash" id="flash"></div><div class="status" id="status">РУЛЕТКА ГОТОВА</div></div></div>
<div class="final" id="final"><div class="finalBox"><small>АУКЦИОН НА 3 ОТМЕТКИ</small><h1>🏆 ПОСЛЕДНИЙ ТАНК</h1><img id="winnerImg" class="winnerImg" alt=""><div class="finalName" id="finalName"></div></div></div>
<script>
let S=null,anim=false,reconnectTimer=null;
const money=n=>new Intl.NumberFormat('ru-RU').format(Math.round(Number(n)||0))+' ₽';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const colors=['#203c60','#5c466f','#285d58','#725039','#3a5679','#66465c','#3d634d','#704c48','#304d6e','#57466c'];
function activeOf(s){return (s.tanks||[]).filter(t=>t.alive&&Number(t.amount)>0)}
function build(active,targetId){const face=document.getElementById('face'),items=document.getElementById('items');items.innerHTML='';if(!active.length){face.style.background='#0a1018';return 0}const raw=active.map(t=>1/Math.max(1,Number(t.amount)||1));const total=raw.reduce((a,b)=>a+b,0);let acc=0,target=0;const stops=[];active.forEach((t,i)=>{const w=raw[i]/total,start=acc*360,end=(acc+w)*360,mid=(start+end)/2;stops.push(`${colors[i%colors.length]} ${start}deg ${end}deg`);const rad=(mid-90)*Math.PI/180;const r=document.getElementById('wheel').clientWidth*0.34;const x=Math.cos(rad)*r,y=Math.sin(rad)*r;const d=document.createElement('div');d.className='item';d.style.setProperty('--x',x+'px');d.style.setProperty('--y',y+'px');d.style.setProperty('--rot',(-mid+90)+'deg');d.innerHTML=`<img src="${t.image}" alt=""><b>${esc(t.name)}</b><small>${money(t.amount)} • ${(w*100).toLocaleString('ru-RU',{maximumFractionDigits:1})}%</small>`;items.appendChild(d);if(t.id===targetId)target=mid;acc=end});face.style.background=`conic-gradient(from 0deg,${stops.join(',')})`;document.getElementById('wheel').style.transition='none';document.getElementById('wheel').style.transform='rotate(0deg)';return target}
function render(s){S=s;const a=activeOf(s);document.getElementById('status').textContent=a.length<2?'НУЖНО МИНИМУМ 2 ТАНКА':'РУЛЕТКА ГОТОВА';if(!anim)build(a,null);if(a.length===1&&s.history?.length){const t=a[0];document.getElementById('finalName').textContent=t.name;document.getElementById('winnerImg').src=t.image;document.getElementById('final').classList.add('show')}else document.getElementById('final').classList.remove('show')}
function animate(oldActive,id,name){return new Promise(resolve=>{anim=true;const target=build(oldActive,id),wheel=document.getElementById('wheel');document.getElementById('status').textContent='РУЛЕТКА КРУТИТСЯ…';requestAnimationFrame(()=>requestAnimationFrame(()=>{const spins=11+Math.floor(Math.random()*3),final=-target+spins*360;wheel.style.transition='transform 12s cubic-bezier(.08,.82,.08,1)';wheel.style.transform=`rotate(${final}deg)`;document.getElementById('flash').classList.add('show');setTimeout(()=>document.getElementById('flash').classList.remove('show'),1100);setTimeout(()=>{document.getElementById('status').textContent='💥 '+name+' ВЫБЫЛ';anim=false;resolve()},12100)}))})}
async function handle(next){if(!next?.tanks)return;if(!S){render(next);return}if((next.updatedAt||0)===(S.updatedAt||0))return;const old=S,oldActive=activeOf(old);const eliminated=next.lastEliminatedId&&next.lastEliminatedId!==old.lastEliminatedId&&oldActive.some(t=>t.id===next.lastEliminatedId);S=next;if(eliminated&&!anim&&oldActive.length>=2){const t=oldActive.find(x=>x.id===next.lastEliminatedId);await animate(oldActive,t.id,t.name);render(next)}else if(!anim)render(next)}
function connect(){try{const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state')handle(m.state)}catch{}};ws.onclose=()=>{clearTimeout(reconnectTimer);reconnectTimer=setTimeout(connect,1500)}}catch{reconnectTimer=setTimeout(connect,1500)}}
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});if(r.ok)await handle(await r.json())}catch{}}
setInterval(poll,1000);poll();connect();
</script>
</body></html>
