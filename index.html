<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAQWINER — Аукцион на 3 отметки</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:#fff;background:#05070b}body{background:radial-gradient(circle at 50% -20%,#263b55 0,transparent 40%),radial-gradient(circle at 0 100%,#172338,transparent 30%),#05070b}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.045;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:36px 36px}.wrap{max-width:1500px;margin:auto;padding:26px;position:relative;z-index:1}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:32px;font-weight:1000;letter-spacing:.04em}.sub{color:#8b99ad;font-size:12px;margin-top:4px}.status{padding:10px 15px;border:1px solid #34465e;background:#0a1018;border-radius:999px;font-size:10px;font-weight:1000}.status.on{box-shadow:0 0 30px #6e91b522}.panel{border:1px solid #29384e;border-radius:22px;background:linear-gradient(180deg,#0c131df5,#080c12f5);box-shadow:0 20px 80px #0008;padding:20px}.heading{display:flex;justify-content:space-between;align-items:end}.heading h1{font-size:20px;margin:0;font-weight:1000}.count{font-size:11px;color:#8290a4}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}.card{position:relative;min-height:205px;border:1px solid #2a3b52;border-radius:17px;background:linear-gradient(180deg,#121c2a,#090e15);padding:14px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);border-color:#657993;box-shadow:0 18px 45px #0007}.card:after{content:"";position:absolute;inset:auto -20% -65%;height:120px;background:radial-gradient(circle,#8aa5c822,transparent 65%);pointer-events:none}.tankimg{display:block;width:100%;height:115px;object-fit:contain;filter:drop-shadow(0 10px 14px #000)}.name{font-size:14px;font-weight:950;min-height:32px;display:flex;align-items:center}.amount{font-size:24px;font-weight:1000;margin-top:4px}.zero{color:#647287}.empty{padding:80px 20px;text-align:center;color:#77869b;font-size:14px}.empty b{display:block;color:#fff;font-size:22px;margin-bottom:7px}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:750px){.wrap{padding:12px}.brand{font-size:24px}.cards{grid-template-columns:repeat(2,1fr)}.card{min-height:180px}.tankimg{height:95px}}@media(max-width:470px){.cards{grid-template-columns:1fr}.header{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body><main class="wrap"><header class="header"><div><div class="brand">🔥 LAQWINER</div><div class="sub">АУКЦИОН НА 3 ОТМЕТКИ • больше донат — меньше шанс выбыть</div></div><div class="status" id="status">● СИНХРОНИЗАЦИЯ</div></header><section class="panel"><div class="heading"><h1>ТАНКИ В АУКЦИОНЕ</h1><div class="count" id="count">0 участников</div></div><div class="cards" id="cards"></div><div class="empty" id="empty" style="display:none"><b>ОЖИДАЕМ ДОНАТЫ</b>Пока ни на один танк не внесена сумма.</div></section></main>
<script>
let S=null,lastUpdated=0;
const money=n=>new Intl.NumberFormat('ru-RU').format(Math.round(Number(n)||0))+' ₽';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function render(s){S=s;const active=s.tanks.filter(t=>t.alive&&Number(t.amount)>0).sort((a,b)=>Number(b.amount)-Number(a.amount));document.getElementById('count').textContent=active.length+' '+(active.length===1?'танк':active.length<5?'танка':'танков');document.getElementById('cards').innerHTML=active.map(t=>`<article class="card"><img class="tankimg" src="${t.image}" loading="lazy"><div class="name">${esc(t.name)}</div><div class="amount">${money(t.amount)}</div></article>`).join('');document.getElementById('empty').style.display=active.length?'none':'block';document.getElementById('status').textContent=active.length?'● ОНЛАЙН • СИНХРОНИЗИРОВАНО':'● ОЖИДАЕМ ДОНАТЫ'}
async function sync(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)return;const s=await r.json();if(!S||s.updatedAt!==lastUpdated){lastUpdated=s.updatedAt||Date.now();render(s)}}catch{document.getElementById('status').textContent='● НЕТ СОЕДИНЕНИЯ'}}
setInterval(sync,1000);sync();
</script></body></html>
